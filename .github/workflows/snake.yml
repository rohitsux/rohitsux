name: Generate Snake

on:
  schedule:
    # rebuilds the contribution snake once a day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # green-on-black palette to match the CRT theme
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=41f048&color_dots=020402,0e5715,1f9a28,41f048,aeffb0

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
